<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>焰流貫穿｜手繪逐格動畫試作</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#efe5d5;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center}small{font-size:11px;letter-spacing:3px;color:#9badae}h1{font-family:serif;font-size:30px;margin:8px 0}a{color:#d4b68c;font-size:13px}.tag{color:#a3b6b4;font-size:12px}.arena{margin-top:24px;border:1px solid #52625e;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#3b4c48,#182a32 75%);position:relative}canvas{display:block;width:100%;aspect-ratio:1000/480}.top{position:absolute;top:16px;left:20px;color:#a7bcb8;font-size:12px}.badge{position:absolute;top:16px;right:20px;border:1px solid #8d714c;border-radius:20px;padding:6px 12px;color:#f1cf99;font-size:12px}.controls{background:#1b2b33;border:1px solid #3d5054;padding:18px;border-radius:16px;margin-top:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;background:#293d42;color:#eee1ce;border:1px solid #59706d;border-radius:8px;padding:9px 16px;cursor:pointer}button.primary{background:#b47a3b;border-color:#d7a665;color:#fff7e7}button:disabled{opacity:.4}label{display:flex;align-items:center;gap:7px;font-size:13px;color:#bbcac6}input{accent-color:#d7a665}#scrub{width:100%;margin:18px 0 6px}#clock{font-size:12px;color:#b9c7c1;margin-left:auto}.stages{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.stages span{font-size:12px;padding:7px 12px;border:1px solid #3d5457;border-radius:20px;color:#819b9b}.stages .on{color:#ffdd9d;border-color:#cf9c61;background:#8d602532}.note{color:#a1b4b3;font-size:13px;line-height:1.8;margin-top:20px}.note strong{color:#e6cba0}details{margin-top:20px;color:#a9b7b3;font-size:13px}details img{display:block;width:100%;margin-top:14px;background:#22343b;border-radius:12px}summary{cursor:pointer}@media(max-width:600px){main{padding:18px 10px}h1{font-size:24px}.tag{display:none}.row{gap:8px}button,select{padding:8px 11px;font-size:13px}.top{font-size:10px;left:12px}.badge{font-size:10px;right:10px}.arena{margin-top:16px}.note{font-size:12px}}</style></head><body><main><header><div><small>FLAME / ANIMATION STUDY 02</small><h1>焰流貫穿</h1><span class="tag">B版Q人物 × 卡通手繪逐格特效</span></div><a href="./">返回三技能樣板</a></header><section class="arena"><div class="top">火法・燼羽 × 訓練魔像</div><div class="badge" id="stage">素材載入中</div><canvas width="1200" height="576" aria-label="火法抬杖、釋放焰流並擊中魔像的逐格動畫"></canvas></section><section class="controls"><div class="row"><button class="primary" id="play" disabled>播放攻擊</button><button id="step" disabled>下一格</button><button id="reset" disabled>回到起點</button><label>速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="loop" checked>循環</label><label><input type="checkbox" id="shake" checked>命中震動</label><span id="clock">0.00 / 3.20 秒</span></div><input id="scrub" type="range" min="0" max="3200" value="0" step="10" aria-label="動畫播放位置"><div class="stages"><span>蓄力</span><span>噴發</span><span>命中</span><span>消散</span></div></section><p class="note"><strong>第一版動態驗證：</strong>16張關鍵影格依時間播放，包含角色姿勢、焰流、爆焰與煙塵。這版用來檢查外觀與演出節奏；影格之間仍可見姿勢和比例變化，尚未達到平滑連續動畫。角色與特效目前合在影格內，後續需分離才能自由站位、改變攻擊方向與選擇目標。</p><details><summary>查看16格原始素材</summary><img src="assets/flame-sequence.png" alt="由蓄力到消散的16格動畫圖集"></details></main><script src="flame-study.js"></script></body></html>
